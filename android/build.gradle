// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        // Google's mirror of Maven Central, tried first: the shop's router
        // has at times resolved Maven Central to an unreachable address.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        // Google's mirror of Maven Central, tried first: the shop's router
        // has at times resolved Maven Central to an unreachable address.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    // The project sits in iCloud Drive, which syncs (and may offload) files.
    // Build output goes in a ".nosync" folder, which iCloud leaves alone.
    layout.buildDirectory = file("${rootProject.projectDir}/build.nosync/${project.name}")
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
